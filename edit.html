<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>餐點資料管理 | What2Eat Admin</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/edit.css">
</head>
<body>
<main>
  <h1>餐點資料管理</h1>
  <form id="addForm" class="add-row">
    <label>餐點名稱<input type="text" id="name" required placeholder="e.g. 牛肉麵"></label>
    <label>適用餐別（分號;隔開）<input type="text" id="meals" placeholder="breakfast;lunch;dinner"></label>
    <label>圖片連結<input type="text" id="image" placeholder="https://..."></label>
    <label>標籤（分號;隔開）<input type="text" id="tags" placeholder="beef;noodle;台式"></label>
    <div class="form-actions">
      <button type="submit">新增餐點</button>
      <span class="msg" id="msg"></span>
    </div>
  </form>
  <div class="table-responsive">
    <table id="foodsTable">
      <thead>
        <tr>
          <th data-sort="name">名稱 ▲▼</th>
          <th data-sort="meals">餐別 ▲▼</th>
          <th data-sort="image">圖片 ▲▼</th>
          <th data-sort="tags">標籤 ▲▼</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</main>
<script src="script/edit.js"></script>
</body>
</html>
